<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>故障单管理 - NetLab</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;
      color: #263445;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      display: flex;
      padding: 24px;
      gap: 24px;
    }

    .sidebar {
      width: 200px;
      flex-shrink: 0;
      background: linear-gradient(180deg, #f7f4fc 0%, #ede7f8 100%);
      border: 1px solid #d9cff0;
      border-radius: 14px;
      box-shadow:
              0 14px 34px rgba(124, 58, 237, .09),
              0 4px 8px rgba(124, 58, 237, .05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .sidebar-logo{
      padding:20px 22px;
      font-size:18px;
      font-weight:bold;
      text-align:center;
      border-bottom:1px solid #d9cff0;
      box-shadow: 0 3px 4px rgba(124, 58, 237, 0.06);
    }
    .sidebar-menu{
      list-style:none;
      padding:12px;
      margin:0;
      flex:1;
    }
    .sidebar-menu li{
      margin-bottom:4px;
    }
    .sidebar-menu li a{
      display:block;
      padding:12px 14px;
      border-radius:9px;
      text-decoration:none;
      color:#4d5968;
    }
    .sidebar-menu li a:hover{
      background:#e3daf2;
    }
    .sidebar-menu li a.active{
      background:#e9e1f6;
      color:#6b21a8;
    }
    .sidebar-user{
      padding:12px 14px 18px;
      border-top:1px solid #d9cff0;
    }
    .user-info-text{
      color:#4d5968;
      font-size:14px;
    }

    .page-shell {
      flex: 1;
      min-width: 0;
      width: auto;
      max-width: none;
      margin: 36px 0;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: #607080;
      text-decoration: none;
    }

    .back-link:hover {
      color: #16baaa;
    }

    .card {
      min-width: 0;
      overflow: hidden;
      background: #fff;
      border: 1px solid #e8edf3;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(31, 45, 61, .07);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 26px 30px;
      border-bottom: 1px solid #edf0f4;
      background: linear-gradient(135deg, #fff4f3, #f7fbff);
    }

    .card-header h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .card-header p {
      margin: 0;
      color: #7b8794;
      font-size: 14px;
    }

    .count {
      flex-shrink: 0;
      padding: 7px 13px;
      border-radius: 999px;
      color: #175cd3;
      background: #eff8ff;
      font-size: 14px;
    }

    .table-wrapper {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      padding: 24px 30px 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }

    th, td {
      padding: 15px 13px;
      border-bottom: 1px solid #edf0f4;
      text-align: left;
    }

    th {
      color: #667085;
      background: #f8fafc;
      font-size: 13px;
      font-weight: 600;
    }

    td {
      font-size: 14px;
    }

    .description {
      min-width: 220px;
      max-width: 360px;
      white-space: normal;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 13px;
    }

    .status-pending {
      color: #b54708;
      background: #fff4e5;
    }

    .status-processing {
      color: #175cd3;
      background: #eff8ff;
    }

    .status-resolved {
      color: #067647;
      background: #ecfdf3;
    }

    .source {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 6px;
      color: #475467;
      background: #f2f4f7;
      font-size: 12px;
    }

    .empty {
      padding: 70px 20px;
      color: #8a94a3;
      text-align: center;
    }

    .empty strong {
      display: block;
      margin-bottom: 8px;
      color: #4d5968;
      font-size: 18px;
    }

    @media (max-width: 900px){
      body{
        flex-direction:column;
        padding:20px;
        gap:20px;
      }
      .sidebar{
        width:100%;
      }
      .page-shell {
        width: 100%;
        margin: 0;
      }
      .card-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .card-header,
      .table-wrapper {
        padding-left: 20px;
        padding-right: 20px;
      }
    }
  </style>
</head>

<body>
<aside class="sidebar">
  <div class="sidebar-logo">实验室管理系统</div>
  <ul class="sidebar-menu">
    <li>
      <a th:href="@{/}" >控制台</a >
    </li>
    <li>
      <a th:href="@{/devices}">设备管理</a >
    </li>
    <li>
      <a th:href="@{/my/reservations}">我的预约</a >
    </li>
    <li>
      <a th:href="@{/admin/reservations}">预约管理</a >
    </li>
    <li>
      <a th:href="@{/admin/fault-records}" class="active">故障单管理</a >
    </li>
  </ul>
  <div class="sidebar-user">
    <div class="user-info-text">
      <span sec:authentication="name"></span>
      <span sec:authorize="hasRole('ADMIN')">（管理员）</span>
      <span sec:authorize="hasRole('USER')">（普通用户）</span>
    </div>
  </div>
</aside>

<main class="page-shell">
  <a class="back-link" th:href="@{/devices}">
    ← 返回设备列表
  </a >

  <section class="card">
    <header class="card-header">
      <div>
        <h1>故障单管理</h1>
        <p>查看学生和管理员提交的所有设备故障</p >
      </div>

      <span class="count"
            th:if="${records != null}"
            th:text="|共 ${records.size()} 条|">
                共 0 条
            </span>
    </header>

    <div class="table-wrapper"
         th:if="${records != null and not #lists.isEmpty(records)}">

      <table>
        <thead>
        <tr>
          <th>故障单编号</th>
          <th>设备编号</th>
          <th>上报人编号</th>
          <th>故障来源</th>
          <th>故障描述</th>
          <th>处理状态</th>
          <th>上报时间</th>
          <th>解决时间</th>
          <th>操作</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="record : ${records}">
          <td th:text="${record.id}">1</td>

          <td th:text="${record.deviceId}">1</td>

          <td th:text="${record.reporterId}">1</td>

          <td>
              <span class="source"
                    th:text="${record.borrowRecordId == null
                              ? '管理员登记'
                              : '借用期间上报'}">
                  借用期间上报
              </span>
          </td>

          <td class="description"
              th:text="${record.description}">
            故障描述
          </td>

          <td>
              <span class="status"
                    th:classappend="${' status-' + #strings.toLowerCase(record.status.name())}"
                    th:text="${record.status.label}">
                  待处理
              </span>
          </td>

          <td th:text="${record.reportedAt == null
                                  ? '-'
                                  : #strings.replace(record.reportedAt.toString(), 'T', ' ')}">
            2026-10-09 10:00
          </td>

          <td th:text="${record.resolvedAt == null
                                  ? '尚未解决'
                                  : #strings.replace(record.resolvedAt.toString(), 'T', ' ')}">
            尚未解决
          </td>

          <td>
            <a th:if="${record.status.name() == 'PENDING'}"
               th:href="@{/admin/fault-records/{id}/maintain(id=${record.id})}">
              开始维修
            </a >

            <a th:if="${record.status.name() == 'PROCESSING'}"
               th:href="@{/admin/fault-records/{id}/result(id=${record.id})}">
              设置维修结果
            </a >

            <span th:if="${record.status.name() == 'RESOLVED'}">
        已处理
            </span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="empty"
         th:if="${records == null or #lists.isEmpty(records)}">
      <strong>暂无故障单</strong>
      <span>系统中目前没有设备故障记录。</span>
    </div>
  </section>
</main>
</body>
</html>
