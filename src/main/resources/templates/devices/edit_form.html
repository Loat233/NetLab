<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改设备 - NetLab</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f7fb;
            color: #263445;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }
        .page-shell {
            width: min(900px, calc(100% - 32px));
            margin: 0 auto;
            padding: 36px 0 60px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 18px;
            color: #607080;
            text-decoration: none;
        }
        .back-link:hover {
            color: #16baaa;
        }
        .card {
            overflow: hidden;
            background: #fff;
            border: 1px solid #e8edf3;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(31, 45, 61, .07);
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 26px 30px;
            border-bottom: 1px solid #edf0f4;
            background: linear-gradient(135deg, #fff4f3, #f7fbff);
        }
        .card-header h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }
        .card-header p {
            margin: 0;
            color: #7b8794;
            font-size: 14px;
        }
        .card-body {
            padding: 24px 30px 30px;
        }
        .form-item {
            margin-bottom: 22px;
        }
        .form-item label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #4d5968;
        }
        .form-item input,
        .form-item select,
        .form-item textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #dce3ec;
            border-radius: 8px;
            font-size: 14px;
            color: #263445;
        }
        .form-item input:focus,
        .form-item select:focus,
        .form-item textarea:focus {
            outline: none;
            border-color: #16baaa;
        }
        .form-item textarea {
            min-height: 110px;
            resize: vertical;
        }
        .form-buttons {
            display: flex;
            gap:12px;
            margin-top:10px;
        }
        .btn {
            padding: 9px 18px;
            border-radius:8px;
            border:none;
            cursor:pointer;
            font-size:14px;
            text-decoration: none;
        }
        .btn-primary {
            background-color: #16baaa;
            color:#fff;
        }
        .btn-primary:hover {
            background-color: #0f9c8e;
        }
        .btn-back {
            background-color:#8a94a3;
            color:#fff;
        }
    </style>
</head>
<body>
<div class="page-shell">
    <a class="back-link" th:href="@{/devices}">← 返回设备列表</a >
    <div class="card">
        <div class="card-header">
            <div>
                <h1>修改设备</h1>
                <p>修改设备基础信息</p >
            </div>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/devices/{id}/edit(id=${device.id})}"
                  th:object="${device}"
                  method="post">

                <div class="form-item">
                    <label>资产编号</label>
                    <input type="text"
                           th:field="*{assetCode}"
                           required>
                </div>

                <div class="form-item">
                    <label>设备名称</label>
                    <input type="text"
                           th:field="*{deviceName}"
                           required>
                </div>

                <div class="form-item">
                    <label>设备分类</label>
                    <select th:field="*{categoryId}" required>
                        <option value="">请选择分类</option>
                        <option th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:text="${category.categoryName}">
                        </option>
                    </select>
                </div>

                <div class="form-item">
                    <label>所属实验室</label>
                    <select th:field="*{laboratoryId}" required>
                        <option value="">请选择实验室</option>
                        <option th:each="laboratory : ${laboratories}"
                                th:value="${laboratory.id}"
                                th:text="${laboratory.labName}">
                        </option>
                    </select>
                </div>

                <div class="form-item">
                    <label>设备型号</label>
                    <input type="text"
                           th:field="*{model}">
                </div>

                <div class="form-item">
                    <label>设备描述</label>
                    <textarea th:field="*{description}"></textarea>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">保存修改</button>
                    <a th:href="@{/devices}" class="btn btn-back">取消</a >
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
