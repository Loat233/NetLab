<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>申请归还 - NetLab</title>
    <link rel="stylesheet" th:href="@{/component/pear/css/pear.css}">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #f4f7fb; color: #263445; font-family: "Microsoft YaHei", Arial, sans-serif; }
        .page-shell { max-width: 900px; margin: 0 auto; padding: 34px 20px 56px; }
        .back-link { display: inline-block; margin-bottom: 18px; color: #607080; text-decoration: none; }
        .back-link:hover { color: #16baaa; }
        .card { background: #fff; border: 1px solid #e8edf3; border-radius: 14px; box-shadow: 0 10px 30px rgba(31,45,61,.07); overflow: hidden; }
        .hero { padding: 30px; background: linear-gradient(135deg, #effdfa, #f7fbff); border-bottom: 1px solid #e8edf3; }
        .hero h1 { margin: 0 0 10px; font-size: 28px; }
        .info-line { color: #728091; font-family: Consolas, monospace; margin:6px 0; }
        .content-wrap { padding: 30px; }
        .actions { display: flex; justify-content: flex-end; gap: 12px; padding: 0 30px 28px; }
        .button { display: inline-flex; align-items: center; justify-content: center; min-width: 112px; height: 42px; padding: 0 18px; border: 1px solid #d8dee7; border-radius: 8px; color: #4d5968; background: #fff; text-decoration: none; cursor:pointer; font-size:15px; }
        .button.primary { border-color: #16baaa; background: #16baaa; color: #fff; }
        .button:hover { opacity:0.9; }
    </style>
</head>
<body>
<main class="page-shell">
    <a class="back-link" th:href="@{/my/reservations}">← 返回我的预约</a >

    <section class="card">
        <div class="hero">
            <h1>申请归还设备</h1>
            <div class="info-line" th:text="|预约编号：${reservation.reservationCode}|">预约编号：</div>
            <div class="info-line" th:text="|预约结束时间：${#temporals.format(reservation.endTime,'yyyy-MM-dd HH:mm')}|">预约结束时间：</div>
        </div>

        <div class="content-wrap">
            <form th:action="@{/my/reservations/{id}/return(id=${reservation.id})}" method="post">
                <div class="actions">
                    <a class="button" th:href="@{/my/reservations}">取消</a >
                    <button class="button primary" type="submit">确认申请归还</button>
                </div>
            </form>
        </div>
    </section>
</main>
</body>
</html>
