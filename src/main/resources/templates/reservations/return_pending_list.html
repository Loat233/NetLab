<table>
    <thead>
    <tr>
        <th>预约编号</th>
        <th>设备 ID</th>
        <th>截止时间</th>
        <th>归还处理</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="reservation : ${reservations}">
        <td th:text="${reservation.reservationCode}"></td>
        <td th:text="${reservation.deviceId}"></td>
        <td th:text="${#temporals.format(
            reservation.endTime,
            'yyyy-MM-dd HH:mm'
        )}"></td>

        <td>
            <form th:action="@{/admin/reservations/{id}/confirmReturn(
                    id=${reservation.id}
                )}"
                  method="post">

                <label>
                    <input type="checkbox"
                           name="damaged"
                           value="true">
                    设备损坏
                </label>

                <input type="text"
                       name="remark"
                       maxlength="500"
                       placeholder="归还备注">

                <button type="submit">确认归还</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
