<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的预约 - NetLab</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: #263445;
            background: #f4f7fb;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            display: flex;
            padding: 24px;
            gap: 24px;
        }

        .sidebar {
            width: 200px;
            flex-shrink: 0;
            background: linear-gradient(180deg, #f7f4fc 0%, #ede7f8 100%);
            border: 1px solid #d9cff0;
            border-radius: 14px;
            box-shadow:
                    0 14px 34px rgba(124, 58, 237, .09),
                    0 4px 8px rgba(124, 58, 237, .05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .sidebar-logo{
            padding:20px 22px;
            font-size:18px;
            font-weight:bold;
            text-align:center;
            border-bottom:1px solid #d9cff0;
            box-shadow: 0 3px 4px rgba(124, 58, 237, 0.06);
        }
        .sidebar-menu{
            list-style:none;
            padding:12px;
            margin:0;
            flex:1;
            box-shadow: 0 2px 3px rgba(124, 58, 237, 0.03);
        }
        .sidebar-menu li{
            margin-bottom:4px;
        }
        .sidebar-menu li a{
            display:block;
            padding:12px 14px;
            border-radius:9px;
            text-decoration:none;
            color:#4d5968;
        }
        .sidebar-menu li a:hover{
            background:#e3daf2;
        }
        .sidebar-menu li a.active{
            background:#e9e1f6;
            color:#6b21a8;
        }
        .sidebar-user{
            padding:12px 14px 18px;
            border-top:1px solid #d9cff0;
            box-shadow: 0 1px 2px rgba(124, 58, 237, 0.01);
        }
        .user-info-text{
            color:#4d5968;
            font-size:14px;
        }

        .page-shell {
            max-width: 1280px;
            width: 100%;
            margin: 36px;
        }

        .page-head {
            margin-bottom: 22px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }
        .page-head-text h1 {
            margin: 0 0 8px;
            font-size: 27px;
        }
        .page-head-text p {
            margin: 0;
            color: #667182;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 90px;
            height: 38px;
            padding: 0 15px;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
            border:none;
        }
        .button.green{
            color:#fff;
            background:#0f766e;
        }
        .button.gray{
            color:#333;
            background:#ffffff;
            border:1px solid #d8dee7;
        }

        .notice {
            margin-bottom: 22px;
            padding:13px 16px;
            border-radius:8px;
        }
        .notice.success{
            background:#f0fff7;
            border:1px solid #b7ebd2;
            color:#168a5b;
        }
        .notice.error{
            background:#fff1f0;
            border:1px solid #ffccc7;
            color:#cf1322;
        }

        .card {
            overflow: hidden;
            background: #fff;
            border: 1px solid #e8edf3;
            border-radius: 14px;
            width: 100%;
        }
        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 22px;
            border-bottom: 1px solid #e8edf3;
        }
        .card-head-left{
            display:flex;
            align-items:center;
            gap:16px;
            flex:1;
        }
        .card-head h2 {
            margin: 0;
            font-size: 18px;
        }
        .count-tag {
            padding: 6px 11px;
            color: #7b8794;
            background: #eff8ff;
            border-radius: 999px;
            font-size: 13px;
        }

        .table-wrap {
            overflow-x:auto;
            width: 100%;
        }
        .table-wrap table{
            width:100%;
            border-collapse: collapse;
        }
        th,td{
            padding:16px 22px;
            border-bottom: 1px solid #edf0f4;
            text-align:left;
            vertical-align:middle;
        }
        th {
            color:#667182;
            background:#f8fafc;
            font-size:13px;
        }
        td {
            font-size:14px;
        }

        .status-tag {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            font-size:12px;
        }
        .action-group{
            display:flex;
            gap:8px;
        }

        .empty-tip {
            padding:70px 22px;
            text-align:center;
            color:#7b8794;
        }

        /* ========== 下面是你原来预约页面自带的样式（保留状态标签、文字截断等原有样式） ========== */
        .code { color: #1e2c3b; font-family: Consolas, monospace; font-size: 13px; }
        .purpose { max-width: 230px; color: #5f6977; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .status-tag[data-status="PENDING"] { background: #fff7e6; color: #d48806; }
        .status-tag[data-status="APPROVED"] { background: #e8faf6; color: #078d79; }
        .status-tag[data-status="REJECTED"] { background: #fff1f0; color: #cf1322; }
        .status-tag[data-status="CANCELLED"] { background: #f0f2f5; color: #77808d; }
        .status-tag[data-status="BORROWED"] { background: #e6f4ff; color: #1677ff; }
        .status-tag[data-status="RETURN_PENDING"] { background: #f9f0ff; color: #722ed1; }
        .status-tag[data-status="COMPLETED"] { background: #f6ffed; color: #389e0d; }
        .device-link { color: #16a795; text-decoration: none; }
        .device-link:hover { text-decoration: underline; }

        @media (max-width:900px){
            body{
                flex-direction:column;
                padding:20px;
                gap:20px;
            }
            .sidebar{
                width:100%;
            }
        }
    </style>
</head>

<body>
<!-- 侧边栏完全复制设备列表的结构，仅【我的预约】加上active -->
<aside class="sidebar">
    <div class="sidebar-logo">实验室管理系统</div>
    <ul class="sidebar-menu">
        <li>
            <a th:href="@{/}" >控制台</a >
        </li>
        <li>
            <a th:href="@{/devices}">设备管理</a >
        </li>
        <li sec:authorize="hasRole('USER')">
            <a th:href="@{/my/reservations}" class="active">我的预约</a >
        </li>
        <li sec:authorize="hasRole('USER')">
            <a th:href="@{/my/fault-records}">我的故障单</a >
        </li>
        <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/reservations}">预约管理</a >
        </li>
        <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/fault-records}">故障单管理</a >
        </li>
    </ul>
    <div class="sidebar-user">
        <div class="user-info-text">
            <span sec:authentication="name"></span>
            <span sec:authorize="hasRole('ADMIN')">（管理员）</span>
            <span sec:authorize="hasRole('USER')">（普通用户）</span>
        </div>
    </div>
</aside>

<main class="page-shell">
    <header class="page-head">
        <div class="page-head-text">
            <h1>我的预约</h1>
            <p>查看预约审核状态和设备使用时间。</p >
        </div>
        <a class="button gray" th:href="@{/index}">返回首页</a >
    </header>

    <div class="notice success" th:if="${message}" th:text="${message}">预约申请已提交</div>
    <div class="notice error"
         role="alert"
         th:if="${error != null}"
         th:text="${error}">
    </div>

    <section class="card">
        <div class="empty-tip" th:if="${#lists.isEmpty(reservations)}">
            <div style="margin-bottom:18px; font-size:30px;">⌁</div>
            <h2 style="margin:0 0 9px; font-size:20px;">暂时没有预约记录</h2>
            <p style="margin:0 0 22px; color:#7a8594;">先去设备列表选择需要使用的实验设备。</p >
            <a class="button green" th:href="@{/devices}">查看设备</a >
        </div>

        <div class="table-wrap" th:unless="${#lists.isEmpty(reservations)}">
            <table>
                <thead>
                <tr>
                    <th>预约编号</th>
                    <th>设备</th>
                    <th>预约时间</th>
                    <th>实验用途</th>
                    <th>状态</th>
                    <th>提交时间</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="reservation : ${reservations}">
                    <td class="code" th:text="${reservation.reservationCode}">RSV-0001</td>
                    <td>
                        <a class="device-link" th:href="@{/devices/{id}(id=${reservation.deviceId})}" th:text="|设备 #${reservation.deviceId}|">设备 #1</a >
                    </td>
                    <td>
                        <div th:text="${#temporals.format(reservation.startTime, 'yyyy-MM-dd HH:mm')}">2026-10-06 09:00</div>
                        <div style="margin-top: 4px; color: #8a94a3;" th:text="|至 ${#temporals.format(reservation.endTime, 'yyyy-MM-dd HH:mm')}|">至 2026-10-06 11:00</div>
                    </td>
                    <td class="purpose" th:title="${reservation.purpose}" th:text="${#strings.isEmpty(reservation.purpose) ? '未填写' : reservation.purpose}">实验用途</td>
                    <td>
                        <span class="status-tag" th:attr="data-status=${reservation.status.name()}" th:text="${reservation.status.label}">待审核</span>
                    </td>
                    <td th:text="${#temporals.format(reservation.createdAt, 'yyyy-MM-dd HH:mm')}">2026-10-04 10:00</td>
                    <td class="action-group">
                        <a class="button gray" th:if="${reservation.status.name() == 'PENDING' or reservation.status.name() == 'APPROVED'}" th:href="@{/my/reservations/{id}/cancel(id=${reservation.id})}">
                            取消预约
                        </a >
                        <span th:unless="${reservation.status.name() == 'PENDING' or reservation.status.name() == 'APPROVED'}">
                            —
                        </span>
                        <a class="button green"
                           th:if="${reservation.status.name() == 'BORROWED'}"
                           th:href="@{/my/reservations/{id}/return(id=${reservation.id})}">
                            申请归还
                        </a >
                        <a class="button gray" th:if="${reservation.status.name() == 'BORROWED' || reservation.status.name() == 'RETURN_PENDING'}"
                           th:href="@{/my/reservations/{id}/report-fault(id=${reservation.id})}">
                            上报故障
                        </a >
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
