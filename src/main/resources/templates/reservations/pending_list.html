<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>待审核预约 - NetLab</title>

    <link rel="stylesheet"
          th:href="@{/component/pear/css/pear.css}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f7fb;
            color: #263445;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        .page-shell {
            max-width: 1280px;
            margin: 0 auto;
            padding: 32px 20px 56px;
        }

        .page-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 22px;
        }

        .page-head h1 {
            margin: 0;
            font-size: 26px;
        }

        .page-head p {
            margin: 8px 0 0;
            color: #667182;
        }

        .head-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 106px;
            height: 40px;
            padding: 0 16px;
            border: 1px solid #d8dee7;
            border-radius: 8px;
            color: #4d5968;
            background: #fff;
            text-decoration: none;
        }

        .button:hover {
            background: #f8fafc;
        }

        .button.primary {
            border-color: #0f766e;
            background: #0f766e;
            color: #fff;
        }

        .button.primary:hover {
            background: #115e59;
        }

        a:focus-visible {
            outline: 2px solid #0f766e;
            outline-offset: 3px;
        }

        .notice {
            margin-bottom: 18px;
            padding: 13px 16px;
            border: 1px solid;
            border-radius: 8px;
        }

        .notice.success {
            border-color: #b7ebd2;
            background: #f0fff7;
            color: #168a5b;
        }

        .notice.error {
            border-color: #ffccc7;
            background: #fff1f0;
            color: #cf1322;
        }

        .card {
            overflow: hidden;
            background: #fff;
            border: 1px solid #e8edf3;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(31, 45, 61, .06);
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 20px;
            border-bottom: 1px solid #e8edf3;
        }

        .card-head h2 {
            margin: 0;
            font-size: 17px;
        }

        .count-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            background: #fff7e6;
            color: #925400;
            font-size: 13px;
            white-space: nowrap;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 1080px;
            border-collapse: collapse;
        }

        th {
            padding: 15px 16px;
            background: #f8fafc;
            border-bottom: 1px solid #e8edf3;
            color: #667182;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #eef1f5;
            font-size: 14px;
            vertical-align: middle;
        }

        tbody tr:hover {
            background: #fbfdfd;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        .code {
            font-family: Consolas, monospace;
            font-size: 13px;
            white-space: nowrap;
        }

        .device-link {
            color: #0f766e;
            text-decoration: none;
            white-space: nowrap;
        }

        .device-link:hover {
            text-decoration: underline;
        }

        .time-cell {
            white-space: nowrap;
            line-height: 1.7;
        }

        .secondary {
            color: #667182;
        }

        .purpose {
            min-width: 160px;
            max-width: 260px;
            line-height: 1.6;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .status-tag {
            display: inline-flex;
            padding: 5px 10px;
            border-radius: 20px;
            background: #fff7e6;
            color: #925400;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .empty {
            padding: 64px 20px;
            text-align: center;
        }

        .empty-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #edf9f7;
            color: #0f766e;
            font-size: 28px;
        }

        .empty h3 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .empty p {
            margin: 0 0 22px;
            color: #667182;
        }

        @media (max-width: 680px) {
            .page-shell {
                padding: 24px 12px 40px;
            }

            .page-head {
                align-items: flex-start;
                flex-direction: column;
            }

            .head-actions {
                width: 100%;
            }

            .head-actions .button {
                flex: 1;
                min-width: 0;
            }
        }
    </style>
</head>

<body>
<main class="page-shell">

    <!-- 页面标题与导航 -->
    <div class="page-head">
        <div>
            <h1>待审核预约</h1>
            <p>查看学生提交的设备预约申请及实验安排。</p>
        </div>

        <div class="head-actions">
            <a class="button"
               th:href="@{/index}">
                返回首页
            </a>

            <a class="button"
               th:href="@{/devices}">
                设备列表
            </a>

            <a class="button primary"
               th:href="@{/admin/reservations}">
                刷新列表
            </a>
        </div>
    </div>

    <!-- 操作结果提示 -->
    <div class="notice success"
         role="status"
         th:if="${message != null}"
         th:text="${message}">
    </div>

    <div class="notice error"
         role="alert"
         th:if="${error != null}"
         th:text="${error}">
    </div>

    <section class="card">

        <div class="card-head">
            <h2>待审核申请</h2>

            <span class="count-badge">
                共
                <strong th:text="${reservations == null ? 0 : #lists.size(reservations)}">
                    0
                </strong>
                条
            </span>
        </div>

        <!-- 没有待审核预约 -->
        <div class="empty"
             th:if="${#lists.isEmpty(reservations)}">

            <div class="empty-icon" aria-hidden="true">✓</div>

            <h3>暂无待审核预约</h3>

            <p>当前没有需要审核的申请，可稍后刷新查看。</p>

            <a class="button primary"
               th:href="@{/admin/reservations/pending}">
                刷新列表
            </a>
        </div>

        <!-- 待审核预约表格 -->
        <div class="table-wrap"
             th:unless="${#lists.isEmpty(reservations)}">

            <table aria-label="待审核预约列表">
                <thead>
                <tr>
                    <th scope="col">序号</th>
                    <th scope="col">预约编号</th>
                    <th scope="col">申请人</th>
                    <th scope="col">设备</th>
                    <th scope="col">预约时间</th>
                    <th scope="col">实验用途</th>
                    <th scope="col">状态</th>
                    <th scope="col">提交时间</th>
                    <th scope="col">操作</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="reservation, row : ${reservations}">

                    <td th:text="${row.count}"></td>

                    <td class="code"
                        th:text="${reservation.reservationCode}">
                    </td>

                    <td th:text="|用户 #${reservation.applicantId}|">
                    </td>

                    <td>
                        <a class="device-link"
                           th:href="@{/devices/{id}(id=${reservation.deviceId})}"
                           th:text="|设备 #${reservation.deviceId}|">
                        </a>
                    </td>

                    <td class="time-cell">
                        <div th:text="${#temporals.format(reservation.startTime, 'yyyy-MM-dd HH:mm')}">
                        </div>

                        <div class="secondary"
                             th:text="|至 ${#temporals.format(reservation.endTime, 'yyyy-MM-dd HH:mm')}|">
                        </div>
                    </td>

                    <td class="purpose"
                        th:text="${#strings.isEmpty(reservation.purpose) ? '未填写' : reservation.purpose}">
                    </td>

                    <td>
                        <span class="status-tag"
                              th:text="${reservation.status.label}">
                        </span>
                    </td>

                    <td class="time-cell"
                        th:text="${#temporals.format(reservation.createdAt, 'yyyy-MM-dd HH:mm')}">
                    </td>

                    <td>
                        <a class="button primary"
                           th:href="@{/admin/reservations/{reservationId}/check(reservationId=${reservation.id})}">
                            审核预约
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </section>
</main>
</body>
</html>
