spring:
  application:
    name: NetLab
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/netlab_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:change_me}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: "${MAIL_HOST:smtp.163.com}"
    port: "${MAIL_PORT:465}"
    username: "${MAIL_USERNAME:your_email@163.com}"
    password: "${MAIL_AUTH_CODE:your_smtp_authorization_code}"

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: "${SERVER_PORT:8080}"